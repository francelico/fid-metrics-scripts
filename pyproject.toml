[project]
name = "fid-metrics-scripts"
version = "0.1.0"
description = "FID/FVD evaluation and video preparation scripts"
requires-python = ">=3.11,<3.12"
dependencies = [
    "hydra-core==1.3.2",
    "imageio==2.37.0",
    "imageio-ffmpeg==0.6.0",
    "matplotlib==3.11.1",
    "numpy==2.3.5",
    "omegaconf==2.3.0",
    "opencv-python==4.13.0.90",
    "pandas>=2.3,<3",
    "pillow==12.0.0",
    "rich==14.3.1",
    "scipy==1.17.0",
    "torch==2.13.0+cu130",
    "torchvision==0.28.0+cu130",
    "wandb==0.24.0",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
